spring.application.name=ridewise

# Keep the console clean: no Spring banner, only warnings from the framework
spring.main.banner-mode=off
logging.level.root=WARN

# Set to false to start the Spring context without the interactive menu (used by tests)
ridewise.console.enabled=true

# Which ride matching strategy to use: nearest | least-active
ridewise.matching-strategy=nearest

# Which fare strategy to use: default | peak
ridewise.fare-strategy=default

# Surge multiplier applied when fare-strategy=peak (must be >= 1)
ridewise.peak-multiplier=1.5
